<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Binary Search Tree Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Binary Search Tree Generator</h1>

    <form id="treeForm">
      <label for="numbers">Enter numbers (comma-separated):</label>
      <input type="text" id="numbers" name="numbers" required />
      <button type="submit">Submit</button>
    </form>

    <div id="output"></div>

    <h2>Previous Trees</h2>
    <div id="previousTrees"></div>

    <script>
      document
        .getElementById("treeForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const input = document.getElementById("numbers").value;

          fetch("http://localhost:8080/process-numbers", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: "numbers=" + encodeURIComponent(input),
          })
            .then((response) => response.json())
            .then((data) => {
              // safely parse the tree
              let parsedTree =
                typeof data.tree === "string"
                  ? JSON.parse(data.tree)
                  : data.tree;

              document.getElementById("output").innerHTML = `
            <h3>Input:</h3>
            <pre>${data.input.join(", ")}</pre>
            <h3>Tree:</h3>
            <pre>${JSON.stringify(parsedTree, null, 2)}</pre>
          `;
            })
            .catch((err) => {
              document.getElementById("output").innerText =
                "Something went wrong!";
              console.error(err);
            });
        });

      // Optional: Load previous trees
      fetch("http://localhost:8080/previous-trees")
        .then((response) => response.json())
        .then((trees) => {
          const container = document.getElementById("previousTrees");
          if (!Array.isArray(trees)) return;

          trees.forEach((tree) => {
            let parsed =
              typeof tree.serializedTree === "string"
                ? JSON.parse(tree.serializedTree)
                : tree.serializedTree;

            const div = document.createElement("div");
            div.classList.add("tree-entry");
            div.innerHTML = `
            <p><strong>Input:</strong> ${tree.inputNumbers.join(", ")}</p>
            <pre>${JSON.stringify(parsed, null, 2)}</pre>
            <hr/>
          `;
            container.appendChild(div);
          });
        })
        .catch((err) => console.error("Failed to load previous trees:", err));
    </script>
  </body>
</html>
